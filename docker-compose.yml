services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookswap}
      MYSQL_USER: ${MYSQL_USER:-bookswap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bookswap_pass}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret_dev}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  app:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-bookswap}
      DB_USER: ${MYSQL_USER:-bookswap}
      DB_PASS: ${MYSQL_PASSWORD:-bookswap_pass}
      DB_ROOT_PASS: ${MYSQL_ROOT_PASSWORD:-root_secret_dev}
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1/health.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 50M
    ports:
      - "${PMA_PORT:-8081}:80"

volumes:
  dbdata: